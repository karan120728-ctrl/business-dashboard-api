<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | FlowOps</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-body">
    <div id="toast-container" class="toast-container"></div>

    <div class="auth-card">
        <div class="auth-header">
            <h2>Reset Password</h2>
            <p id="reset-desc">Enter your email to receive a secure reset token.</p>
        </div>

        <!-- Step 1: Request Token -->
        <form id="forgot-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" class="input" required placeholder="john@example.com">
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="btn-forgot">Get Reset Token</button>
        </form>

        <!-- Step 2: Reset Password (Hidden initially) -->
        <form id="reset-form" class="hidden">
            <div class="form-group">
                <label>Reset Token (Dev Mode)</label>
                <input type="text" id="reset-token" class="input" required placeholder="Token will appear here">
                <p style="font-size: 0.75rem; color: var(--danger); margin-top: 0.25rem;">In Production, this code is sent to your email.</p>
            </div>
            <div class="form-group">
                <label for="new-password">New Password</label>
                <div class="password-field">
                    <input type="password" id="new-password" class="input" required placeholder="••••••••" minlength="6">
                    <i class="fas fa-eye password-toggle" id="toggle-reset-password"></i>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="btn-reset">Update Password</button>
        </form>

        <div class="auth-footer text-center" style="margin-top: 1.5rem;">
            <a href="login.html" style="font-size: 0.875rem; color: var(--primary); text-decoration: none;"><i class="fas fa-arrow-left"></i> Back to Login</a>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script>
        const forgotForm = document.getElementById('forgot-form');
        const resetForm = document.getElementById('reset-form');
        const resetDesc = document.getElementById('reset-desc');

        // Password Toggle
        document.getElementById('toggle-reset-password').addEventListener('click', function() {
            const passInput = document.getElementById('new-password');
            const type = passInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passInput.setAttribute('type', type);
            this.classList.toggle('fa-eye-slash');
        });

        // Handle Request
        forgotForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const btn = document.getElementById('btn-forgot');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Requesting...';

            try {
                const response = await fetch(`${window.API_URL}/users/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await response.json();

                if (response.ok) {
                    console.log("Token Received:", data);
                    const token = data.data ? data.data.resetToken : (data.resetToken || 'ERROR');
                    
                    showToast('Token generated!', 'success');
                    forgotForm.classList.add('hidden');
                    resetForm.classList.remove('hidden');
                    resetDesc.innerText = 'Now set your new secure password.';
                    
                    const tokenInput = document.getElementById('reset-token');
                    tokenInput.value = token;
                    
                    // If it's still empty for some reason, alert the user with the token
                    if (!tokenInput.value && token) {
                        alert("Your Reset Token is: " + token);
                        tokenInput.value = token;
                    }
                } else {
                    showToast(data.message || 'Error requesting token', 'error');
                }
            } catch (err) {
                showToast('Server connection failed.', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Get Reset Token';
            }
        });

        // Handle Reset
        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = document.getElementById('reset-token').value;
            const newPassword = document.getElementById('new-password').value;
            const btn = document.getElementById('btn-reset');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Updating...';

            try {
                const response = await fetch(`${window.API_URL}/users/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });
                const data = await response.json();

                if (response.ok) {
                    showToast('Password updated! Redirecting...', 'success');
                    setTimeout(() => { window.location.href = 'login.html'; }, 2000);
                } else {
                    showToast(data.message || 'Reset failed', 'error');
                }
            } catch (err) {
                showToast('Server connection failed.', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Update Password';
            }
        });
    </script>
</body>
</html>
