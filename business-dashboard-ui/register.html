<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | FlowOps</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body class="auth-body">
    <div id="toast-container" class="toast-container"></div>

    <div class="auth-card">
        <div class="auth-header">
            <h2>Join FlowOps</h2>
            <p>Create your account to get started.</p>
        </div>

        <div class="role-toggle">
            <div class="role-btn active" data-role="customer" onclick="setRole('customer')">👤 Customer</div>
            <div class="role-btn" data-role="driver" onclick="setRole('driver')">🚛 Driver</div>
            <div class="role-btn" data-role="admin" onclick="setRole('admin')">💼 Admin</div>
        </div>

        <form id="register-form">
            <input type="hidden" id="role" value="customer">
            
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" class="input" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" class="input" required placeholder="john@example.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-field">
                    <input type="password" id="password" class="input" required placeholder="••••••••" minlength="6">
                    <i class="fas fa-eye password-toggle" id="toggle-password"></i>
                </div>
            </div>
            
            <!-- Dynamic Business Field -->
            <div class="form-group" id="business-group">
                <label for="business-input" id="business-label">Business Invite Code</label>
                <input type="text" id="business-input" class="input" required placeholder="e.g. FLOW-XXXXXX">
                <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem;" id="business-hint">Ask your manager for the company code.</p>
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="btn-register-submit">Create Account</button>
        </form>

        <p style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-muted);">
            Already have an account? <a href="login.html" style="color: var(--primary); text-decoration: none;">Sign in here</a>
        </p>
    </div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script>
        // Password Visibility Toggle
        document.getElementById('toggle-password').addEventListener('click', function() {
            const passInput = document.getElementById('password');
            const type = passInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passInput.setAttribute('type', type);
            this.classList.toggle('fa-eye-slash');
        });

        function setRole(role) {
            document.getElementById('role').value = role;
            document.querySelectorAll('.role-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.role-btn[data-role="${role}"]`).classList.add('active');
            
            const label = document.getElementById('business-label');
            const input = document.getElementById('business-input');
            const hint = document.getElementById('business-hint');

            if (role === 'admin') {
                label.innerText = 'Company / Business Name';
                input.placeholder = 'e.g. Acme Logistics';
                hint.innerText = 'This will create a new private workspace for your business.';
            } else {
                label.innerText = 'Business Invite Code';
                input.placeholder = 'e.g. FLOW-XXXXXX';
                hint.innerText = 'Ask your manager for the company code.';
            }
        }

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;
            const businessVal = document.getElementById('business-input').value.trim();
            const btn = document.getElementById('btn-register-submit');

            if (!name || !email || !password || !businessVal) {
                return showToast('Please fill in all fields', 'error');
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creating account...';

            const payload = { 
                name, email, password, role,
                businessName: role === 'admin' ? businessVal : undefined,
                businessCode: role !== 'admin' ? businessVal : undefined
            };

            try {
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creating account...';
                
                // Render free tier can take up to 60s to wake up
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 60000);

                const response = await fetch(`${window.API_URL}/users/createUser`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                
                const data = await response.json();
                
                if (response.ok || response.status === 201) {
                    if (role === 'admin' && data.data && data.data.businessCode) {
                        alert(`🚀 Business Created!\n\nYour Invite Code is: ${data.data.businessCode}\n\nShare this code with your Drivers and Customers.`);
                    }
                    showToast('Account created! Redirecting to login...', 'success');
                    setTimeout(() => { window.location.href = 'login.html'; }, 2000);
                } else {
                    showToast(data.message || 'Registration failed. Please try again.', 'error');
                }
            } catch (err) {
                if (err.name === 'AbortError') {
                    // Server woke up but response took too long - account likely created
                    showToast('Server is waking up. Your account may already be created. Try logging in!', 'warning');
                    setTimeout(() => { window.location.href = 'login.html'; }, 3000);
                } else {
                    showToast('Cannot connect to server. Please check your connection.', 'error');
                }
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Create Account';
            }
        });
    </script>
</body>
</html>
