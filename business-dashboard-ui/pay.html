<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment | FlowOps</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .invoice-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 2.5rem;
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 500px;
            margin: 2rem auto;
            border: 1px solid var(--border);
        }
        .invoice-header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px dashed var(--border);
        }
        .invoice-header h2 {
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }
        .business-badge {
            display: inline-block;
            background: var(--primary-light);
            color: var(--primary);
            padding: 0.25rem 0.75rem;
            border-radius: var(--radius-full);
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        .invoice-details {
            margin-bottom: 2rem;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            font-size: 0.95rem;
        }
        .detail-label {
            color: var(--text-muted);
        }
        .detail-value {
            font-weight: 500;
            color: var(--text-main);
        }
        .amount-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 0;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            margin-bottom: 2rem;
        }
        .amount-label {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-main);
        }
        .amount-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
        }
        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: var(--radius-full);
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: capitalize;
        }
        .status-paid { background: #dcfce7; color: #166534; }
        .status-unpaid { background: #fef9c3; color: #854d0e; }
        .status-overdue { background: #fee2e2; color: #991b1b; }
        
        .loading-state { text-align: center; padding: 3rem 0; color: var(--text-muted); }
        .error-state { text-align: center; padding: 2rem 0; color: var(--danger); display: none; }
    </style>
</head>
<body class="auth-body" style="align-items: flex-start; padding-top: 4rem;">
    <div id="toast-container" class="toast-container"></div>

    <div class="invoice-card" id="invoice-container">
        <div class="loading-state" id="loading-state">
            <i class="fa-solid fa-circle-notch fa-spin fa-2x mb-3"></i>
            <p>Loading your secure invoice...</p>
        </div>

        <div class="error-state" id="error-state">
            <i class="fa-solid fa-triangle-exclamation fa-3x mb-3"></i>
            <h3 id="error-title">Link Invalid</h3>
            <p id="error-desc" class="text-muted mt-2">This payment link is invalid or has expired.</p>
        </div>

        <div id="invoice-content" style="display: none;">
            <div class="invoice-header">
                <div class="business-badge" id="business-name">FlowOps</div>
                <h2>Payment Request</h2>
                <p class="text-muted">Invoice #<span id="invoice-id"></span></p>
                <div class="mt-3">
                    <span id="invoice-status" class="status-badge status-unpaid">Unpaid</span>
                </div>
            </div>

            <div class="invoice-details">
                <div class="detail-row">
                    <span class="detail-label">Billed To</span>
                    <span class="detail-value" id="customer-name">John Doe</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Order #</span>
                    <span class="detail-value" id="order-id">ORD-123</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Due Date</span>
                    <span class="detail-value" id="due-date">Oct 24, 2026</span>
                </div>
                <div class="detail-row" id="payment-date-row" style="display: none;">
                    <span class="detail-label">Paid On</span>
                    <span class="detail-value" id="payment-date">-</span>
                </div>
                <div class="detail-row" id="overdue-row" style="display: none;">
                    <span class="detail-label" style="color: var(--danger);">Overdue By</span>
                    <span class="detail-value" id="overdue-days" style="color: var(--danger); font-weight: bold;">-</span>
                </div>
            </div>

            <div class="amount-row">
                <span class="amount-label">Total Due</span>
                <span class="amount-value"><span id="currency-symbol">₹</span><span id="amount-due">0.00</span></span>
            </div>

            <button class="btn btn-primary btn-block" id="btn-pay" style="font-size: 1.1rem; padding: 1rem;">
                <i class="fa-solid fa-lock mr-2"></i> Pay Now Securely
            </button>
            <p style="text-align: center; margin-top: 1rem; font-size: 0.8rem; color: var(--text-muted);">
                <i class="fa-solid fa-shield-halved mr-1"></i> Secured by FlowOps Payments
            </p>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            
            const loadingState = document.getElementById('loading-state');
            const errorState = document.getElementById('error-state');
            const invoiceContent = document.getElementById('invoice-content');

            if (!token) {
                loadingState.style.display = 'none';
                errorState.style.display = 'block';
                return;
            }

            try {
                const response = await fetch(`${window.API_URL}/invoices/pay/${token}`);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Failed to load invoice');
                }

                const invoice = data.invoice;
                
                // Populate data
                document.getElementById('business-name').textContent = invoice.business_name;
                document.getElementById('invoice-id').textContent = invoice.id;
                document.getElementById('customer-name').textContent = invoice.customer_name;
                document.getElementById('order-id').textContent = invoice.order_id;
                document.getElementById('due-date').textContent = new Date(invoice.due_date).toLocaleDateString();
                document.getElementById('amount-due').textContent = parseFloat(invoice.amount).toFixed(2);
                
                // Handle currency preference if available from localStorage
                const pref = localStorage.getItem('flowops_currency_pref');
                if (pref) {
                    const prefObj = JSON.parse(pref);
                    if (prefObj.currency === 'USD') {
                        document.getElementById('currency-symbol').textContent = '$';
                        document.getElementById('amount-due').textContent = (parseFloat(invoice.amount) * prefObj.rate).toFixed(2);
                    }
                }

                const statusBadge = document.getElementById('invoice-status');
                statusBadge.textContent = invoice.status;
                statusBadge.className = `status-badge status-${invoice.status}`;

                const payBtn = document.getElementById('btn-pay');
                if (invoice.status === 'paid') {
                    payBtn.disabled = true;
                    payBtn.innerHTML = '<i class="fa-solid fa-check-circle mr-2"></i> Already Paid';
                    payBtn.style.background = 'var(--success)';
                    
                    if (invoice.used_at) {
                        document.getElementById('payment-date-row').style.display = 'flex';
                        document.getElementById('payment-date').textContent = new Date(invoice.used_at).toLocaleDateString();
                    }
                } else if (invoice.status === 'overdue') {
                    payBtn.innerHTML = '<i class="fa-solid fa-lock mr-2"></i> Pay Overdue Amount';
                    
                    const due = new Date(invoice.due_date);
                    const now = new Date();
                    const diffTime = Math.abs(now - due);
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    
                    document.getElementById('overdue-row').style.display = 'flex';
                    document.getElementById('overdue-days').textContent = `${diffDays} days`;
                }

                // Show content
                loadingState.style.display = 'none';
                invoiceContent.style.display = 'block';

                // Handle real payment gateway redirect
                payBtn.addEventListener('click', async () => {
                    payBtn.disabled = true;
                    payBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Opening Secure Payment...';
                    
                    try {
                        // Call the new real payment endpoint
                        const payRes = await fetch(`${window.API_URL}/payments/pay-invoice/${token}`, {
                            method: 'POST'
                        });
                        const payData = await payRes.json();
                        
                        if (payRes.ok && payData.url) {
                            // Redirect to Razorpay/Stripe
                            window.location.href = payData.url;
                        } else {
                            throw new Error(payData.message || 'Payment gateway unavailable');
                        }
                    } catch(e) {
                        showToast(e.message, 'error');
                        payBtn.disabled = false;
                        payBtn.innerHTML = '<i class="fa-solid fa-lock mr-2"></i> Try Again';
                    }
                });

            } catch (err) {
                loadingState.style.display = 'none';
                errorState.style.display = 'block';
                document.getElementById('error-desc').textContent = err.message;
            }
        });
    </script>
</body>
</html>
