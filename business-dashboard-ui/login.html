<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FlowOps</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-body">
    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <div class="auth-card">
        <div class="auth-header">
            <h2>FlowOps</h2>
            <p>Welcome back! Please login to your account.</p>
        </div>
        <form id="login-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" class="input" required placeholder="admin@flowops.com">
            </div>
            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                    <label for="password" style="margin-bottom: 0;">Password</label>
                    <a href="forgot-password.html" style="font-size: 0.75rem; color: var(--primary); text-decoration: none;">Forgot Password?</a>
                </div>
                <div class="password-field">
                    <input type="password" id="password" class="input" required placeholder="••••••••">
                    <i class="fas fa-eye password-toggle" id="toggle-password"></i>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="btn-login-submit">Sign In</button>
        </form>
        <p style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-muted);">
            Don't have an account? <a href="register.html" style="color: var(--primary); text-decoration: none;">Register here</a>
        </p>

            <div class="login-shortcuts" style="margin-top: 2rem; border-top: 1px solid var(--border); padding-top: 1.5rem;">
                <p style="text-align: center; color: var(--text-muted); font-size: 0.8rem; margin-bottom: 1rem;">Experience the RBX (Role-Based Experience)</p>
                <div class="shortcut-grid">
                    <button class="btn btn-secondary btn-sm" onclick="quickLogin('admin@flowops.com', 'admin123')"><i class="fa-solid fa-user-shield"></i> Admin</button>
                    <button class="btn btn-secondary btn-sm" onclick="quickLogin('driver@flowops.com', 'password')"><i class="fa-solid fa-truck"></i> Driver</button>
                    <button class="btn btn-secondary btn-sm" onclick="quickLogin('customer@flowops.com', 'password')"><i class="fa-solid fa-user-tag"></i> Customer</button>
                </div>
            </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api/base.js"></script>
    <script>
        // Password Visibility Toggle
        document.getElementById('toggle-password').addEventListener('click', function() {
            const passInput = document.getElementById('password');
            const type = passInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passInput.setAttribute('type', type);
            this.classList.toggle('fa-eye-slash');
        });

        function quickLogin(email, pass) {
            document.getElementById('email').placeholder = email;
            document.getElementById('password').placeholder = '••••••••';
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btn-login-submit');

            btn.disabled = true;
            btn.innerHTML = 'Signing in...';

            try {
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Signing in...';
                
                // Render free tier can take up to 60s to wake up from sleep
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 60000);

                const response = await fetch(`${window.API_URL}/users/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                
                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('flowops_token', data.token);
                    localStorage.setItem('flowops_user', JSON.stringify(data.user));
                    window.location.href = 'index.html';
                } else {
                    showToast(data.message || 'Login failed', 'error');
                }
            } catch (err) {
                if (err.name === 'AbortError') {
                    showToast('Server is warming up. Please wait 10 seconds and try again.', 'warning');
                } else {
                    showToast('Network error. Please check your connection.', 'error');
                }
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Sign In';
            }
        });
    </script>
</body>
</html>
